# Render Blueprint — ReacheR API (one-click deploy).
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
# This creates ONE service: the API server. The front end lives on GitHub Pages.
#
# HONEST COST / LIMITS (Render docs, "Deploy for Free", read 2026-11-20):
# - plan: free = $0/month. The service sleeps after 15 minutes with no traffic
#   and takes ~1 minute to wake on the next request. 750 free instance hours
#   per workspace per month.
# - Free web services CANNOT attach a persistent disk, and their filesystem is
#   ephemeral: the SQLite file is LOST on every redeploy, restart, or
#   spin-down. A free-tier deploy is a DEMO: registrations, messages and
#   projects work, but do not treat the data as durable.
# - DURABLE hosting: change `plan` to `starter` ($7/mo) and uncomment the
#   `disk` block below (1 GB = $0.25/mo). That is ~$7.25/mo total for a
#   persistent SQLite database that survives restarts and deploys.
# - ADMIN_TOKEN is generated by Render (generateValue) — keep it secret; it is
#   the Bearer token for the admin endpoints. PUBLIC_URL is set after the first
#   deploy to the service's public URL (e.g. https://reacher-api-874c.onrender.com).

services:
  - type: web
    name: reacher-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /data/reacher.db
      - key: PUBLIC_URL
        value: https://reacher-api-874c.onrender.com
      - key: ADMIN_TOKEN
        generateValue: true
    # --- Durable hosting (Starter plan and up only — uncomment together) ---
    # plan: starter
    # disk:
    #   name: reacher-data
    #   mountPath: /data
    #   sizeGB: 1
